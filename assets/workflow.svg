<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="292" viewBox="0 0 1120 292" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Hiyaza workflow: prepare, use, extract, review and deliver</title>
<desc id="desc">Merge and clean source Excel datasets; use the application; extract KML drawing data to Excel; validate and correct records with manual review; create final datasets and Word delivery reports. These are separate tools operated in sequence.</desc>
<style>
text { font-family: Segoe UI, Inter, Arial, sans-serif; }
.mono { font-family: Consolas, Monaco, monospace; }
.travel {animation: travel 14s linear infinite;} @keyframes travel {to {stroke-dashoffset:-856}}
.s0 {animation: stage 10s ease-in-out 0s infinite;}
.s1 {animation: stage 10s ease-in-out 2s infinite;}
.s2 {animation: stage 10s ease-in-out 4s infinite;}
.s3 {animation: stage 10s ease-in-out 6s infinite;}
.s4 {animation: stage 10s ease-in-out 8s infinite;}
@keyframes stage {0%,40%,100% {opacity:.35} 15%,25% {opacity:1}}
@media (prefers-reduced-motion: reduce) {
  .animated { animation: none !important; }
  .motion-only { display: none !important; }
  .still-only { display: inline !important; }
}
</style>
<rect width="1120" height="292" rx="20" fill="#0B1220"/><text x="32" y="36" font-size="12" fill="#5AD9F5" font-weight="600" class="mono" letter-spacing="1.5">HIYAZA / THE WORKFLOW</text><text x="32" y="73" font-size="27" fill="#F1F6FD" font-weight="650" >From source data to a reviewed delivery.</text><rect x="32" y="103" width="198" height="113" rx="12" fill="#111E31" stroke="#25354B"/><path d="M47 103H215" stroke="#5AD9F5" stroke-width="2" class="animated stage s0"/><text x="47" y="130" font-size="11" fill="#5AD9F5" font-weight="600" class="mono">01 / PREPARE</text><text x="47" y="162" font-size="18" fill="#F1F6FD" font-weight="650" >Merge &amp; clean</text><text x="47" y="190" font-size="11.5" fill="#A4B5CC" font-weight="400" >Source Excel datasets</text><path d="M232 159H244M240 155L244 159L240 163" stroke="#A4B5CC"/><rect x="246" y="103" width="198" height="113" rx="12" fill="#111E31" stroke="#25354B"/><path d="M261 103H429" stroke="#B8F16D" stroke-width="2" class="animated stage s1"/><text x="261" y="130" font-size="11" fill="#B8F16D" font-weight="600" class="mono">02 / USE</text><text x="261" y="162" font-size="18" fill="#F1F6FD" font-weight="650" >Application</text><text x="261" y="190" font-size="11.5" fill="#A4B5CC" font-weight="400" >Work with holdings data</text><path d="M446 159H458M454 155L458 159L454 163" stroke="#A4B5CC"/><rect x="460" y="103" width="198" height="113" rx="12" fill="#111E31" stroke="#25354B"/><path d="M475 103H643" stroke="#FFBD87" stroke-width="2" class="animated stage s2"/><text x="475" y="130" font-size="11" fill="#FFBD87" font-weight="600" class="mono">03 / EXTRACT</text><text x="475" y="162" font-size="18" fill="#F1F6FD" font-weight="650" >GIS → Excel</text><text x="475" y="190" font-size="11.5" fill="#A4B5CC" font-weight="400" >KML drawing outputs</text><path d="M660 159H672M668 155L672 159L668 163" stroke="#A4B5CC"/><rect x="674" y="103" width="198" height="113" rx="12" fill="#111E31" stroke="#25354B"/><path d="M689 103H857" stroke="#C6ADFF" stroke-width="2" class="animated stage s3"/><text x="689" y="130" font-size="11" fill="#C6ADFF" font-weight="600" class="mono">04 / REVIEW</text><text x="689" y="162" font-size="18" fill="#F1F6FD" font-weight="650" >Validate &amp; correct</text><text x="689" y="190" font-size="11.5" fill="#A4B5CC" font-weight="400" >Match records; review cases</text><path d="M874 159H886M882 155L886 159L882 163" stroke="#A4B5CC"/><rect x="888" y="103" width="198" height="113" rx="12" fill="#111E31" stroke="#25354B"/><path d="M903 103H1071" stroke="#5AD9F5" stroke-width="2" class="animated stage s4"/><text x="903" y="130" font-size="11" fill="#5AD9F5" font-weight="600" class="mono">05 / DELIVER</text><text x="903" y="162" font-size="18" fill="#F1F6FD" font-weight="650" >Reports &amp; handoff</text><text x="903" y="190" font-size="11.5" fill="#A4B5CC" font-weight="400" >Final data + Word reports</text><path d="M131 234H987" stroke="#25354B" stroke-dasharray="3 7"/><path d="M131 234H987" stroke="#5AD9F5" stroke-width="2" stroke-dasharray="20 836" class="animated travel"/><text x="32" y="268" font-size="14" fill="#A4B5CC" font-weight="400" >Separate tools, used in sequence — with manual review and correction throughout.</text>
</svg>
