<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Mustafa Elbaz — Software Developer</title>
<desc id="desc">Building software-driven solutions across applications, data, automation and GIS. Understand, plan, build, review, improve and deliver.</desc>
<style>
text { font-family: Segoe UI, Inter, Arial, sans-serif; }
.mono { font-family: Consolas, Monaco, monospace; }
.orbit { transform-origin: 903px 214px; animation: orbit 24s linear infinite; }
.orbit-reverse { transform-origin: 903px 214px; animation: orbit 45s linear infinite reverse; }
.float { animation: float 7s ease-in-out infinite; }
.pulse { transform-origin: 52px 48px; animation: pulse 3s ease-in-out infinite; }
.circuit { animation: dash 9s linear infinite; }
.blink { animation: blink 1.2s steps(1) infinite; }
@keyframes orbit { to { transform: rotate(360deg); } }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
@keyframes pulse { 0%,100% { opacity: .2; transform: scale(.8); } 50% { opacity: .8; transform: scale(1.3); } }
@keyframes dash { to { stroke-dashoffset: -535; } }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .animated { animation: none !important; }
  .motion-only { display: none !important; }
  .still-only { display: inline !important; }
}
</style>

