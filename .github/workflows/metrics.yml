name: GitHub Metrics

on:
  # Runs every day at 00:00 UTC
  schedule:
    - cron: "0 0 * * *"
  # Allows manual trigger from Actions tab
  workflow_dispatch:
  # Also runs on every push to main
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:

      # ── Card 1: General Stats ──────────────────────────────────────────
      - name: General Stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/stats.svg
          base: header, activity, community, repositories
          plugin_lines: yes
          plugin_traffic: yes
          config_timezone: Africa/Cairo
          config_display: large

      # ── Card 2: Top Languages ──────────────────────────────────────────
      - name: Top Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: lines, percentage
          plugin_languages_limit: 8
          config_timezone: Africa/Cairo

# ── Card 3: Streak ────────────────────────────────────────────────
      - name: Streak
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/streak.svg
          base: ""
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: graph
          config_timezone: Africa/Cairo
          config_display: large

# ── Card 4: Activity Feed ──────────────────────────────────────────
      - name: Activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/activity.svg
          base: ""
          plugin_activity: yes
          plugin_activity_limit: 8
          plugin_activity_days: 14
          plugin_activity_filter: push, pr, issue, release
          config_timezone: Africa/Cairo
          config_display: large
